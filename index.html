<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento de Fretes</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; background: #e9ecef; padding: 10px; border-radius: 6px; flex-wrap: wrap; }
    .select-filtro { padding: 6px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; font-weight: bold; }
    .tabs-dias { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 8px; border-bottom: 2px solid #2b6cb0; margin-bottom: 15px; }
    .tab-dia { padding: 6px 10px; background: #edf2f7; border: 1px solid #cbd5e0; cursor: pointer; border-radius: 4px; font-weight: 500; white-space: nowrap; font-size: 12px; text-align: center; }
    .tab-dia.active { background: #2b6cb0; color: white !important; border-color: #2b6cb0; font-weight: bold; }
    .tab-dia.fim-semana-feriado { color: #e53e3e; font-weight: bold; background: #fff5f5; border-color: #feb2b2; }
    
    .turno-section { margin-bottom: 25px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; }
    .turno-title { background: #2b6cb0; color: white; margin: -10px -10px 10px -10px; padding: 10px; border-radius: 5px 5px 0 0; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .tabela-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1200px; font-size: 13px; }
    th { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 8px 5px; text-align: center; font-size: 12px; font-weight: bold; }
    td { border: 1px solid #cbd5e1; padding: 4px; text-align: center; vertical-align: middle; }
    tr:nth-child(even) { background-color: #f8fafc; }
    
    .num-linha { font-weight: bold; color: #64748b; width: 30px; }
    input[type="text"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; }
    input[type="text"]:focus { border-color: #3182ce; outline: none; background: #fffbe6; }
    
    .data-hora-cell { font-size: 11px; color: #4a5568; line-height: 1.2; font-weight: 500; background: #edf2f7; padding: 4px; border-radius: 3px; }
    
    .btn-ok { width: 100%; padding: 6px 0; border: 1px solid #cbd5e1; background: #e2e8f0; cursor: pointer; border-radius: 4px; font-weight: bold; color: #475569; font-size: 12px; }
    .btn-ok.checked { background: #28a745; color: white; border-color: #28a745; }
    .ok-header { background: #16a34a; color: white; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <label for="selectMes"><strong>Mês:</strong></label>
    <select id="selectMes" class="select-filtro" onchange="atualizarInterface()">
      <option value="0">Janeiro</option><option value="1">Fevereiro</option>
      <option value="2">Março</option><option value="3">Abril</option>
      <option value="4">Maio</option><option value="5">Junho</option>
      <option value="6">Julho</option><option value="7">Agosto</option>
      <option value="8">Setembro</option><option value="9">Outubro</option>
      <option value="10">Novembro</option><option value="11">Dezembro</option>
    </select>

    <label for="selectAno"><strong>Ano:</strong></label>
    <select id="selectAno" class="select-filtro" onchange="atualizarInterface()">
    </select>
  </div>

  <div class="tabs-dias" id="diasContainer"></div>

  <!-- TURNO MANHÃ -->
  <div class="turno-section">
    <div class="turno-title">Turno Manhã</div>
    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 35px;">#</th>
            <th style="width: 110px;">Nº Atendimento</th>
            <th style="width: 160px;">Nome do Cliente</th>
            <th style="width: 140px;">Nome do Vendedor</th>
            <th style="width: 140px;">Anotado por</th>
            <th style="width: 130px;">Dia e Hora da Anotação</th>
            <th>Observações</th>
            <th style="width: 140px;">Motorista</th>
            <th style="width: 110px;" class="ok-header">OK da Logística</th>
          </tr>
        </thead>
        <tbody id="tbody-manha"></tbody>
      </table>
    </div>
  </div>

  <!-- TURNO TARDE -->
  <div class="turno-section">
    <div class="turno-title">Turno Tarde</div>
    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 35px;">#</th>
            <th style="width: 110px;">Nº Atendimento</th>
            <th style="width: 160px;">Nome do Cliente</th>
            <th style="width: 140px;">Nome do Vendedor</th>
            <th style="width: 140px;">Anotado por</th>
            <th style="width: 130px;">Dia e Hora da Anotação</th>
            <th>Observações</th>
            <th style="width: 140px;">Motorista</th>
            <th style="width: 110px;" class="ok-header">OK da Logística</th>
          </tr>
        </thead>
        <tbody id="tbody-tarde"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let diaAtual = 1;

  // Feriados Nacionais Fixos (Dia-Mês index 0)
  const feriadosFixos = [
    "1-0",   // Confraternização Universal (1 Jan)
    "21-3",  // Tiradentes (21 Abr)
    "1-4",   // Dia do Trabalho (1 Mai)
    "7-8",   // Independência do Brasil (7 Set)
    "12-9",  // Nossa Sra Aparecida (12 Out)
    "2-10",  // Finados (2 Nov)
    "15-10", // Proclamação da República (15 Nov)
    "20-10", // Consciência Negra (20 Nov)
    "25-11"  // Natal (25 Dez)
  ];

  // Inicializa seletores de Mês e Ano
  const dataHoje = new Date();
  document.getElementById('selectMes').value = dataHoje.getMonth();

  const selectAno = document.getElementById('selectAno');
  const anoAtualSystem = dataHoje.getFullYear();
  for (let a = anoAtualSystem - 1; a <= anoAtualSystem + 5; a++) {
    const opt = document.createElement('option');
    opt.value = a;
    opt.innerText = a;
    if (a === anoAtualSystem) opt.selected = true;
    selectAno.appendChild(opt);
  }

  function obterChaveStorage() {
    const mes = document.getElementById('selectMes').value;
    const ano = document.getElementById('selectAno').value;
    return `fretes_v3_${ano}_${mes}_dia_${diaAtual}`;
  }

  function atualizarInterface() {
    gerarAbasDias();
    carregarTabelas();
  }

  function gerarAbasDias() {
    const diasContainer = document.getElementById('diasContainer');
    diasContainer.innerHTML = '';

    const mes = parseInt(document.getElementById('selectMes').value);
    const ano = parseInt(document.getElementById('selectAno').value);

    // Quantidade total de dias no mês/ano selecionado
    const totalDias = new Date(ano, mes + 1, 0).getDate();
    if (diaAtual > totalDias) diaAtual = totalDias;

    const diasSemanaAbrev = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

    for (let i = 1; i <= totalDias; i++) {
      const dataObj = new Date(ano, mes, i);
      const diaSemanaIndex = dataObj.getDay(); // 0 = Dom, 6 = Sáb
      const diaSemanaTexto = diasSemanaAbrev[diaSemanaIndex];

      const ehFimDeSemana = (diaSemanaIndex === 0 || diaSemanaIndex === 6);
      const ehFeriado = feriadosFixos.includes(`${i}-${mes}`);

      const btn = document.createElement('button');
      btn.className = 'tab-dia' + (i === diaAtual ? ' active' : '');
      if (ehFimDeSemana || ehFeriado) {
        btn.classList.add('fim-semana-feriado');
      }

      btn.innerText = `Dia ${i < 10 ? '0' + i : i} (${diaSemanaTexto})`;
      
      btn.onclick = function() {
        document.querySelectorAll('.tab-dia').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        diaAtual = i;
        carregarTabelas();
      };

      diasContainer.appendChild(btn);
    }
  }

  function construirLinha(turno, index, dados = {}) {
    const tr = document.createElement('tr');
    const dataHoraStr = dados.dataHora || '-';

    tr.innerHTML = `
      <td class="num-linha">${index + 1}</td>
      <td>
        <input type="text" id="${turno}-atendimento-${index}" value="${dados.atendimento || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Nº Atendimento">
      </td>
      <td>
        <input type="text" id="${turno}-cliente-${index}" value="${dados.cliente || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Cliente">
      </td>
      <td>
        <input type="text" id="${turno}-vendedor-${index}" value="${dados.vendedor || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Vendedor">
      </td>
      <td>
        <input type="text" id="${turno}-anotadoPor-${index}" value="${dados.anotadoPor || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Anotado por">
      </td>
      <td>
        <div class="data-hora-cell" id="${turno}-dataHora-${index}">${dataHoraStr}</div>
      </td>
      <td>
        <input type="text" id="${turno}-obs-${index}" value="${dados.obs || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Observações">
      </td>
      <td>
        <input type="text" id="${turno}-motorista-${index}" value="${dados.motorista || ''}" 
               onchange="salvarCampo('${turno}', ${index})" placeholder="Motorista">
      </td>
      <td>
        <button type="button" class="btn-ok ${dados.ok ? 'checked' : ''}" 
                onclick="toggleOk('${turno}', ${index})">
          ${dados.ok ? 'OK ✓' : 'Pendente'}
        </button>
      </td>
    `;
    return tr;
  }

  function carregarTabelas() {
    const chave = obterChaveStorage();
    const dadosSalvos = JSON.parse(localStorage.getItem(chave)) || { manha: {}, tarde: {} };

    const tbodyManha = document.getElementById('tbody-manha');
    const tbodyTarde = document.getElementById('tbody-tarde');

    tbodyManha.innerHTML = '';
    tbodyTarde.innerHTML = '';

    for (let i = 0; i < 15; i++) {
      const dadosLinhaManha = dadosSalvos.manha ? (dadosSalvos.manha[i] || {}) : {};
      tbodyManha.appendChild(construirLinha('manha', i, dadosLinhaManha));

      const dadosLinhaTarde = dadosSalvos.tarde ? (dadosSalvos.tarde[i] || {}) : {};
      tbodyTarde.appendChild(construirLinha('tarde', i, dadosLinhaTarde));
    }
  }

  function salvarCampo(turno, index) {
    const chave = obterChaveStorage();
    let dadosSalvos = JSON.parse(localStorage.getItem(chave)) || { manha: {}, tarde: {} };

    if (!dadosSalvos[turno]) dadosSalvos[turno] = {};
    if (!dadosSalvos[turno][index]) dadosSalvos[turno][index] = {};

    const atendimento = document.getElementById(`${turno}-atendimento-${index}`).value;
    const cliente = document.getElementById(`${turno}-cliente-${index}`).value;
    const vendedor = document.getElementById(`${turno}-vendedor-${index}`).value;
    const anotadoPor = document.getElementById(`${turno}-anotadoPor-${index}`).value;
    const obs = document.getElementById(`${turno}-obs-${index}`).value;
    const motorista = document.getElementById(`${turno}-motorista-${index}`).value;

    let dataHora = dadosSalvos[turno][index].dataHora;
    if ((atendimento || cliente || vendedor || anotadoPor || obs || motorista) && !dataHora) {
      const agora = new Date();
      dataHora = `${agora.toLocaleDateString('pt-BR')} ${agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
      document.getElementById(`${turno}-dataHora-${index}`).innerText = dataHora;
    } else if (!atendimento && !cliente && !vendedor && !anotadoPor && !obs && !motorista && !dadosSalvos[turno][index].ok) {
      dataHora = '-';
      document.getElementById(`${turno}-dataHora-${index}`).innerText = '-';
    }

    dadosSalvos[turno][index] = {
      atendimento,
      cliente,
      vendedor,
      anotadoPor,
      obs,
      motorista,
      dataHora,
      ok: dadosSalvos[turno][index].ok || false
    };

    localStorage.setItem(chave, JSON.stringify(dadosSalvos));
  }

  function toggleOk(turno, index) {
    const chave = obterChaveStorage();
    let dadosSalvos = JSON.parse(localStorage.getItem(chave)) || { manha: {}, tarde: {} };

    if (!dadosSalvos[turno]) dadosSalvos[turno] = {};
    if (!dadosSalvos[turno][index]) dadosSalvos[turno][index] = {};

    const novoStatusOk = !dadosSalvos[turno][index].ok;
    dadosSalvos[turno][index].ok = novoStatusOk;

    localStorage.setItem(chave, JSON.stringify(dadosSalvos));
    carregarTabelas();
  }

  atualizarInterface();
</script>

</body>
</html>
